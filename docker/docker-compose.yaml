services:
  ollama:
    container_name: ai-tools-ollama-ollama

    build:
      context: .
      dockerfile: services/ollama/Dockerfile
      args:
        ADMIN_USER: ${ADMIN_USER}
        ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT_PUBLIC}:${OLLAMA_PORT}"

    environment:
      OLLAMA_HOST: 0.0.0.0
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OLLAMA_CONTEXT_LENGTH: 32768

    volumes:
      - ollama:/root/.ollama
      - ./shared:/shared

  gateway:
    container_name: ai-tools-ollama-gateway

    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        ADMIN_USER: ${ADMIN_USER}
        ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    depends_on:
      - ollama

    environment:
      OLLAMA_URL: ${OLLAMA_URL}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    ports:
      - "${GATEWAY_PORT_PUBLIC}:${GATEWAY_PORT}"

    volumes:
      - gateway:/data

    restart: unless-stopped

  frontend:
    container_name: ai-tools-ollama-frontend

    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        ADMIN_USER: ${ADMIN_USER}
        ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    restart: unless-stopped

    ports:
      - "${OLLAMA_ADMIN_PORT_PUBLIC}:8501"

    depends_on:
      - gateway

    environment:
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_URL_PUBLIC: ${OLLAMA_URL_PUBLIC}
      OLLAMA_PORT: ${OLLAMA_PORT}
      OLLAMA_PORT_PUBLIC: ${OLLAMA_PORT_PUBLIC}
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_URL_PUBLIC: ${GATEWAY_URL_PUBLIC}
      GATEWAY_PORT: ${GATEWAY_PORT}
      GATEWAY_PORT_PUBLIC: ${GATEWAY_PORT_PUBLIC}
      #
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

  ollama-init:
    container_name: ai-tools-ollama-init
    image: ollama/ollama:latest
    restart: "no"

    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: ollama:${OLLAMA_PORT}

    volumes:
      - ${OLLAMA_MODELS_FILE:-./models.yaml}:/models.yaml:ro
      - ./services/ollama-init/entrypoint.sh:/entrypoint.sh:ro

    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  openwebui:
    container_name: ai-tools-ollama-openwebui

    build:
      context: .
      dockerfile: services/openwebui/Dockerfile
      args:
        OPENWEBUI_IMAGE: ${OPENWEBUI_IMAGE}
        ADMIN_USER: ${ADMIN_USER}
        ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    restart: unless-stopped

    ports:
      - "${OPENWEBUI_PORT_PUBLIC}:8080"

    depends_on:
      - gateway

    environment:
      OLLAMA_URL: ${OLLAMA_URL}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    volumes:
      - ollama:/root/.ollama
      - openwebui:/app/backend/data

  mongodb:
    container_name: ai-tools-ollama-mongodb

    image: mongo:7

    restart: unless-stopped

    volumes:
      - mongodb:/data/db

  librechat:
    container_name: ai-tools-ollama-librechat

    image: ${LIBRECHAT_IMAGE}

    restart: unless-stopped

    ports:
      - "${LIBRECHAT_PORT_PUBLIC}:3080"

    depends_on:
      - mongodb
      - ollama

    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV}
      CONFIG_PATH: /app/librechat.yaml
      ENDPOINTS: custom

    volumes:
      - ./services/librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat_images:/app/client/public/images

volumes:
  ollama:
  gateway: {}
  openwebui: {}
  mongodb: {}
  librechat_images: {}
