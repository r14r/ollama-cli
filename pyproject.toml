[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-cli"
version = "1.1.1"
description = "Ollama blob + manifest inspector with orphan detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.0",
    "ruff>=0.14.8",
    "pyinstaller>=6.10.0",
    "shiv>=1.0.6",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
ollama-cli = "ollama_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

# Enable everything Black would do
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Enable isort behavior
[tool.ruff.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["ollama_cli"]

# Enable or disable rule sets
[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
]
ignore = []
